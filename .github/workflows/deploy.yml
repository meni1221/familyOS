name: Deploy to Production

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: What happens next
        run: |
          echo "The production build succeeded."
          echo "This workflow does not deploy yet: production runs"
          echo "docker-compose.prod.yml on the server (see DEPLOYMENT.md)."
          echo "Tests and type checks run in the CI workflow."
